# You can change the features by overriding the values
#CONFIG_ZMK_KEYBOARD_NAME='uConsole9900'
# timeout for backlight for keyboard in miliseconds
CONFIG_ZMK_IDLE_TIMEOUT=30000         

# Indicator for Capslock Setting
# Disabled on purpose: on this board pwm2 (what this indicator drives) is
# wired to the trackpad backlight/power, not a real CapsLock LED. See
# NOTES.md's CapsLock/trackpad bugfix entry. CapsLock still works as a
# modifier via Fn+Tab, it just has no visual feedback, which is the intended tradeoff
# (trackpad staying powered matters far more than a CapsLock light).
CONFIG_ZMK_INDICATOR_CAPSLOCK=n
CONFIG_ZMK_INDICATOR_CAPSLOCK_BRT=100

# Indicator for Layer Setting
# enable LED indicator for current layer number
CONFIG_ZMK_INDICATOR_LED=y                            
# set brightness of the led indicator of layer 2 in 1-100
CONFIG_ZMK_IDICATOR_LAYER_BRT=100                     
# set the maximium brightness of cycle effect in 1-100
CONFIG_ZMK_IDICATOR_LAYER_CYCLE_MAXBRT=100            
# set the minium brightness of cycle effect in 1-100
CONFIG_ZMK_IDICATOR_LAYER_CYCLE_MINBRT=20             
# set the cycle interval of cycle effect in miliseconds
CONFIG_ZMK_IDICATOR_LAYER_CYCLE_INTERVAL=20           
# set the brightness step of cycle effect 
CONFIG_ZMK_IDICATOR_BRT_STEP=5                        
# set the blink interval for indicator layer 4 in miliseconds
CONFIG_ZMK_IDICATOR_BLINK_INTERVAL=300  

# Keyboard backlight Setting
# enable keyboard backlight
CONFIG_ZMK_BACKLIGHT=y                                
# set the brightness the keyboard backlight when powered on in 1-100
CONFIG_ZMK_BACKLIGHT_BRT_START=40                    
# set the brightness step for each change of backlight brightness
CONFIG_ZMK_BACKLIGHT_BRT_STEP=10                      
# enable keyboard backlight on when powered on
CONFIG_ZMK_BACKLIGHT_ON_START=n                       
# enable automatic turn off when no keypress detected
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y    

# Setting for Scrolling of trackpad
# Scroll speed in percent, independent of the pointer speed. 100 is the
# original rate. This is the one to change.
CONFIG_TRACKPAD_SCROLL_SPEED=60
# How long the trackpad waits between reads while scrolling, in milliseconds.
# Raising it also slows scrolling, but makes it coarser. Best left alone.
CONFIG_TRACKPAD_SCROLL_INTERVAL=20     

# Mouse Speed Multiplier in horizontal direction in percent(use whole numbers)
CONFIG_TRACKPAD_SPEEDMULTIPLIER_HORIZONTAL=120
# Mouse Speed Multiplier in vertical direction in percent(use whole numbers)
CONFIG_TRACKPAD_SPEEDMULTIPLIER_VERTICAL=120

# Lift detection: the trackpad sensor's own assert/de-assert, which stops it
# reporting motion as a finger leaves, so the pointer does not jump when you
# lift your thumb. It is switched on with Fn + ] and off with Fn + [, and the
# choice is saved. It starts off, because on some trackpads it stops a bare
# finger registering at all. This is what "on" writes to the sensor: 0xA0 is
# the sensor's engine bit plus that feature.
CONFIG_INPUT_A320_OFN_ENGINE=0xA0

# The trackpad light goes out while the trackpad is scrolling (Select held,
# or a scroll switch on) and comes back afterwards. If your light does the
# opposite, also set CONFIG_ZMK_TRACKPAD_SCROLL_LIGHT_INVERT=y. Set this to n
# to leave the light alone.
CONFIG_ZMK_TRACKPAD_SCROLL_LIGHT=y

#stop outside crystal
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

#CONFIG_ZMK_BOARD_COMPAT=n
# Gamepad mode (Fn+G): adds a joystick to the USB HID descriptor. Needs the
# jhob101/zmk fork (see west.yml).
CONFIG_ZMK_JOYSTICK=y

# Bluetooth off: inside the uConsole the keyboard is USB only. This also
# removes the pairing keys that were on right Fn + Esc and right Fn + 1-4.
CONFIG_ZMK_BLE=n
# Bluetooth used to switch saved settings on as a side effect. Keep them, so
# the backlight still remembers whether it was on.
CONFIG_SETTINGS=y
