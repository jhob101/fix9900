# Publishes a GitHub Release with the firmware attached.
#
# To make a release, change the version number in the VERSION file on main
# (edit it on GitHub or push a commit). This workflow then builds the firmware
# and creates the release and its tag, v<version>, with bb9900-zmk.uf2 attached,
# so people can flash without forking the repo or signing in to download a
# build artifact.
#
# The text on the release page comes from .github/release-notes.md. Changing
# that file without changing VERSION updates the text of the current release
# and leaves its firmware file alone.
name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/release-notes.md

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Read the version and look for its release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must look like 1.2.3, got '$version'"
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag exists: only its text will be updated."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag does not exist yet: building and publishing it."
          fi

  # Only a new version needs a build. Updating the text of an existing
  # release must not replace the firmware people may already have downloaded.
  build:
    needs: check
    if: needs.check.outputs.exists == 'false'
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0

  release:
    name: Publish release
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Update the text of the existing release
        if: needs.check.outputs.exists == 'true'
        run: gh release edit "$TAG" --notes-file .github/release-notes.md

      - name: Download the built firmware
        if: needs.check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware

      - name: Create the release
        if: needs.check.outputs.exists == 'false'
        run: |
          ls -l firmware
          gh release create "$TAG" firmware/bb9900-zmk.uf2 \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file .github/release-notes.md
