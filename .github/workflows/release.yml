# Publishes a GitHub Release with the firmware attached.
#
# To make a release, change the version number in the VERSION file on main
# (edit it on GitHub or push a commit). This workflow then builds the firmware
# and creates the release and its tag, v<version>, with bb9900-zmk.uf2 attached,
# so people can flash without forking the repo or signing in to download a
# build artifact.
name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Read the version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must look like 1.2.3, got '$version'"
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Download the built firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l firmware
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Raise the number in VERSION."
            exit 1
          fi
          gh release create "$TAG" firmware/bb9900-zmk.uf2 \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --notes-file - <<'EOF'
          Firmware for the hack2you uConsole trackpad keyboard.

          Download `bb9900-zmk.uf2` below and follow the
          [flashing instructions](https://github.com/${{ github.repository }}#flashing).
          What every key does is in the
          [README](https://github.com/${{ github.repository }}#what-it-does).

          Back up the firmware you are running now before you flash
          (copy `CURRENT.UF2` off the bootloader drive). This is a spare-time
          project, tested on one keyboard: flash at your own risk.
          EOF
