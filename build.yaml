# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
---
include:
  # Standard firmware: pressing the trackpad is a left click, and a tap on B
  # is a middle click.
  - board: bb9900
  # Same firmware with those two swapped: pressing the trackpad is a middle
  # click, and a tap on B is a left click.
  - board: bb9900
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DMIDDLE_CLICK_TRACKPAD
    artifact-name: bb9900-zmk-middle-click
  # One-handed layout: mouse buttons and a scroll switch on the face buttons.
  - board: bb9900
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DONE_HANDED
    artifact-name: bb9900-zmk-one-handed
